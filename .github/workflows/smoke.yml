name: smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm manual smoke test'
        required: true
      allowed_actors:
        description: 'Optional comma-separated allowed actor logins (empty = no restriction)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.11'
      - name: Validate inputs and secrets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm }}" != "run" ]; then
            echo "Confirm input not set to 'run' - aborting."
            exit 1
          fi
          if [ -z "${{ secrets.DC_MAR_API_KEY }}" ]; then
            echo "Missing required secret: DC_MAR_API_KEY"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.allowed_actors }}" ]; then
            allowed="${{ inputs.allowed_actors }}"
            actor="${{ github.actor }}"
            IFS=',' read -ra arr <<< "$allowed"
            ok=0
            for a in "${arr[@]}"; do
              a_trim="$(echo $a | xargs)"
              if [ "$a_trim" = "$actor" ]; then
                ok=1
                break
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "Actor $actor is not allowed to run this workflow (allowed: $allowed)"
              exit 1
            fi
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"
      - name: Sync environment
        run: uv sync --locked --extra test
      - name: Run smoke tests
        env:
          DC_MAR_API_KEY: ${{ secrets.DC_MAR_API_KEY }}
          DC_RUN_SMOKE_TESTS: 1
        run: uv run --extra test pytest tests/test_drift_smoke.py -q
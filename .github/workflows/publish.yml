name: publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Ensure CHANGELOG contains release notes
        run: |
          # Extract version from tag 'vX.Y.Z'
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Checking CHANGELOG.md for version $VERSION"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing section for version $VERSION" >&2
            echo "Ensure you updated CHANGELOG.md (moved Unreleased -> $VERSION) before tagging." >&2
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.6.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

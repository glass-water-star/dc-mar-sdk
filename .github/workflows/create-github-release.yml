name: Create GitHub Release from changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
      - name: Extract changelog for tag
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          # Extract the changelog section for the exact version. Stop at the next '## [' header.
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1 }
            found && index($0, header) != 1 && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changelog.md

          if [ ! -s changelog.md ]; then
            echo "No changelog entry found for $VERSION" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --title "Release ${{ github.ref_name }}"
          --notes-file changelog.md

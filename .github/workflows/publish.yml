name: publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dc-mar-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"
      - name: Ensure CHANGELOG contains release notes
        run: |
          # Extract version from tag 'vX.Y.Z'
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Checking CHANGELOG.md for version $VERSION"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing section for version $VERSION" >&2
            echo "Ensure you updated CHANGELOG.md (moved Unreleased -> $VERSION) before tagging." >&2
            exit 1
          fi
      - name: Ensure package version matches tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: tag version $VERSION does not match pyproject.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
